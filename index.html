<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b2f45" />
    <title>Minecraft Work Pet</title>
    <link rel="icon" href="./icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MC-PET" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="pet-canvas"></canvas>
      <div id="particles"></div>
      <div id="bubble" hidden></div>
    </div>

    <button id="btn-menu" aria-label="메뉴 열기/닫기">⚙️</button>

    <!-- 조작 패널 (Windows 데스크톱 펫은 우클릭 메뉴 → "꾸미기·프리셋 창"에서 열림) -->
    <div id="panel">
      <div class="tabs" id="tabs">
        <button data-tab="char" class="on">🧍 캐릭터</button>
        <button data-tab="deco">🎨 꾸미기</button>
        <button data-tab="preset">💾 프리셋</button>
        <button data-tab="ai">🤖 AI</button>
        <button id="btn-panel-close" class="desk-only" aria-label="닫기">✕</button>
      </div>

      <section data-tab="char">
        <div class="row">
          <button id="btn-skin" class="primary">🎨 스킨 불러오기</button>
          <button id="btn-name">👤 닉네임</button>
          <button id="btn-pip" hidden>📺 PiP</button>
          <button id="btn-reset" title="기본 스킨">↺</button>
        </div>
        <div class="row">
          <span class="label">팔</span>
          <div class="seg" id="arms">
            <button data-v="auto">자동</button>
            <button data-v="classic">클래식</button>
            <button data-v="slim">슬림</button>
          </div>
          <span id="skin-info"></span>
        </div>
        <div class="row">
          <span class="label">🔍 크기</span>
          <div class="seg" id="zoom"></div>
          <span class="hint zoom-hint">두 손가락·휠로도 조절</span>
        </div>
        <div class="row chips" id="modes"></div>
      </section>

      <section data-tab="deco" hidden>
        <div class="row"><span class="label">배경</span><div class="chips" id="themes"></div></div>
        <div class="row">
          <span class="label">도구</span>
          <div class="seg" id="setup">
            <button data-v="laptop">💻 노트북</button>
            <button data-v="desktop">⌨️ 키보드+마우스</button>
          </div>
        </div>
        <div class="row"><span class="label">책상</span><div class="swatches" id="desk-colors"></div></div>
        <div class="row"><span class="label">키보드</span><div class="swatches" id="kb-colors"></div></div>
        <div class="row" id="mouse-row"><span class="label">마우스</span><div class="swatches" id="mouse-colors"></div></div>
      </section>

      <section data-tab="preset" hidden>
        <div class="row">
          <input id="preset-name" type="text" placeholder="프리셋 이름 (예: 겨울 코딩)" maxlength="20" />
          <button id="btn-preset-save" class="primary small">💾 지금 모습 저장</button>
        </div>
        <div id="preset-list"></div>
        <p class="hint">스킨·팔·배경·도구·색깔이 함께 저장돼요. 이 기기(브라우저)에만 저장됩니다.</p>
        <p class="hint" id="build-info"></p>
      </section>

      <section data-tab="ai" hidden>
        <div class="row">
          <span class="label">🎭 성격</span>
          <span id="persona-summary" class="persona-summary"></span>
          <button id="btn-persona">✏️ 설정</button>
        </div>
        <div class="row"><span class="label">AI</span><div class="seg" id="ai-provider"></div></div>
        <p class="hint" id="ai-mode-hint"></p>
        <div class="row" id="ai-key-row">
          <span id="ai-key-state" class="label"></span>
          <button id="btn-ai-key">🔑 API 키 입력</button>
          <button id="btn-ai-key-del" hidden>삭제</button>
        </div>
        <div class="row" id="ai-model-row"><span class="label">모델</span><div class="seg" id="ai-model"></div></div>
        <div class="row">
          <span class="label">AI 대사</span>
          <div class="seg" id="ai-lines">
            <button data-v="off">끔</button>
            <button data-v="rare">가끔 (5분)</button>
            <button data-v="often">자주 (1분)</button>
          </div>
        </div>
        <div class="row">
          <button id="btn-chat" class="primary">💬 말 걸기</button>
          <button id="btn-new-motion" class="primary">✨ 새 동작 만들기</button>
        </div>
        <div id="motion-list"></div>
        <p class="hint">API 키는 이 기기에만 저장되고 Google·Anthropic 서버로만 전송돼요.</p>
      </section>
    </div>

    <!-- 팝업 입력 창 (API 키 입력, Windows 의 글 입력) -->
    <div id="modal" hidden>
      <form id="modal-form">
        <label id="modal-label" for="modal-input"></label>
        <p id="modal-hint" class="hint"></p>
        <a id="modal-link" target="_blank" rel="noopener" hidden>🔗 키 발급 페이지 열기</a>
        <input id="modal-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <label id="modal-label2" for="modal-textarea" hidden></label>
        <textarea id="modal-textarea" rows="4" hidden></textarea>
        <div class="row">
          <button type="button" id="modal-paste" hidden>📋 붙여넣기</button>
          <button type="button" id="modal-cancel">취소</button>
          <button type="submit" class="primary">확인</button>
        </div>
      </form>
    </div>

    <input type="file" id="skin-file" accept="image/png,image/*" hidden />
    <div id="toast" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
